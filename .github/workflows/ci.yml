name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          for f in $(find src -name '*.js'); do node --check "$f" || exit 1; done
          for f in $(find tests -name '*.mjs'); do node --check "$f" || exit 1; done
      - name: Phase 18C unit tests
        run: npm run test:unit
      - name: Phase 18C4 deployment foundation tests
        run: node tests/deployment-foundation.test.mjs
      - name: Phase 20 unit tests
        run: node tests/phase-20.unit.mjs
      - name: Integration + regression tests (in-memory MongoDB)
        run: |
          node tests/phase-18c.integration.mjs
          node tests/phase-20.integration.mjs
          node tests/phase-20.bootstrap.mjs
          node tests/phase-21.regression.mjs
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend build + lint + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high