# Render Blueprint — KMES School backend (Phase 18C-4, STAGING)
#
# This file is the machine-readable definition used by Render to create the
# STAGING backend service. It declares the Web Service name, root directory,
# start command, health check, and every environment variable NAME.
#
# SECURITY: This file intentionally contains NO secret values. Every secret
# (`MONGODB_URI`, `JWT_SECRET`, Cloudinary, Facebook, AI) is entered by an
# operator in the Render dashboard "Environment" tab / service settings using
# the variable names declared below. Never commit real values.
#
# The `rootDir: backend` points Render at the Express application; the service
# auto-selects Node. `NODE_ENV` is set to `staging` so the app runs in its
# isolated pre-production mode (never production).

services:
  - type: web
    name: kmes-staging-api
    runtime: node
    rootDir: backend
    plan: starter
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        # Current staging frontend on Vercel (preview URL) joined with the
        # project root alias so both remain explicitly allowed (no wildcard).
        value: https://kmes-school-lzs3g1qdw-saugatb40-8093.vercel.app,https://kmes-school.vercel.app
      - key: FRONTEND_URL
        value: https://kmes-school-lzs3g1qdw-saugatb40-8093.vercel.app
      - key: CLIENT_URL
        value: https://kmes-school-lzs3g1qdw-saugatb40-8093.vercel.app
      - key: RESET_LINK_BASE
        value: https://kmes-school-lzs3g1qdw-saugatb40-8093.vercel.app
      - key: TRUST_PROXY
        value: "1"
      - key: EMAIL_PROVIDER
        value: mock
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
    # Backend has no build step; source runs directly.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true